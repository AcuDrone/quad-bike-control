; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds the firmware only; the host-side unit tests run with `pio test -e native`.
[platformio]
default_envs = esp32-s3-devkitc-1

; ─── Global defaults (inherited by all environments) ─────────────────────────
[env]
lib_deps =
    https://github.com/mavlink/c_library_v2.git
    mathieucarbou/ESPAsyncWebServer@^3.4.6
    bblanchon/ArduinoJson@^6.21.3
    DNSServer
    https://github.com/coryjfowler/MCP_CAN_lib.git

lib_ignore = AsyncTCP_RP2040W

; Console runs on the ESP32-S3 native USB CDC device (USB-C connector), NOT UART0.
; UART0 / GPIO43-44 (Prog header X1) is the steering VESC link (aztec board: R63/R64
; to the CH9121T removed) — never move the console or any log output onto it.
; CORE_DEBUG_LEVEL=0 compiles out the Arduino log_x() calls, which print through the
; ROM putc path (UART0 by default) and would leak text into the VESC link.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ─── ESP32-S3-DevKitC-1 N16R8 (16 MB flash, OPI PSRAM not used) ─────────────
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi  ; quad flash + quad PSRAM SDK (OPI PSRAM unused, frees GPIO 33-37)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3

; ─── Host-side unit tests (Arduino-free code only) ──────────────────────────
; `pio test -e native`: the Bosch LWS frame decoder (include/Lws305.h) and its
; validation/health logic (src/LwsSensor.cpp) — test_lws305 — and the steering
; mode selection / sensorless rate mapping (include/SteerRate.h, header-only) —
; test_steer_rate. Overrides every inherited ESP32 setting; only LwsSensor.cpp
; from src/ is compiled.
[env:native]
platform = native
framework =
lib_deps =
lib_ignore =
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*> +<LwsSensor.cpp>
test_framework = unity
test_build_src = yes
test_filter =
    test_lws305
    test_steer_rate
