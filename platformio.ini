; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; `pio run` builds the firmware only; the host-side unit tests run with `pio test -e native`.
[platformio]
default_envs = esp32-s3-devkitc-1

; ─── Global defaults (inherited by all environments) ─────────────────────────
[env]
lib_deps =
    https://github.com/mavlink/c_library_v2.git
    mathieucarbou/ESPAsyncWebServer@^3.4.6
    bblanchon/ArduinoJson@^6.21.3
    DNSServer
    https://github.com/coryjfowler/MCP_CAN_lib.git

lib_ignore = AsyncTCP_RP2040W

; Console runs on UART0 (GPIO43 TX / GPIO44 RX) through the DevKitC-1's on-board
; USB-UART bridge (the "COM" connector). Do NOT add -DARDUINO_USB_CDC_ON_BOOT=1 on this
; board: the native USB CDC device would claim GPIO19/20 (USB D-/D+), which carry the
; R/N gear switches.
; CORE_DEBUG_LEVEL=0 compiles out the Arduino core's own log_x() calls. Unlike the
; Control_v0 board (where UART0 is a VESC/LAN link that must stay silent) nothing breaks
; here if they print — UART0 is the console — so this only keeps the console readable
; (firmware logging goes through Debug::, which is unaffected) and matches master.
build_flags =
    -DCORE_DEBUG_LEVEL=0

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ─── ESP32-S3-DevKitC-1 N16R8 (16 MB flash, OPI PSRAM not used) ─────────────
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi  ; quad flash + quad PSRAM SDK (OPI PSRAM unused, frees GPIO 33-37)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3

; ─── Host-side unit tests (Arduino-free code only) ──────────────────────────
; `pio test -e native`: the Bosch LWS frame decoder (include/Lws305.h) and its
; validation/health logic (src/LwsSensor.cpp) — test_lws305 — and the steering
; mode selection / sensorless rate mapping (include/SteerRate.h, header-only) —
; test_steer_rate — and the steering sensor direction (include/SteerSensorDir.h,
; header-only) — test_steer_sensor_dir — and the max-speed limiter law
; (include/SpeedLimiterLaw.h, header-only) — test_speed_limiter — and the
; closed-loop steering position law (include/SteerPositionLaw.h, header-only) —
; test_steer_position — and the USB steering diagnostics parser / experiment logic
; (include/SteerDiagLaw.h, header-only) — test_steer_diag — and the transmission gear sync
; (include/TransmissionLaw.h, header-only) — test_transmission_sync — and the throttle
; opening rate limit (include/ThrottleSlewLaw.h, header-only) — test_throttle_slew — and the
; steering park correction (include/SteerParkLaw.h, header-only) — test_steer_park — and the
; WiFi SSID / OTA hostname chip suffix (include/DeviceId.h, header-only) — test_device_id — and
; the brake travel time / hold drive (include/BrakeLaw.h, header-only) — test_brake_law — and
; the relay board tables / mask construction / board detection (include/RelayBoardLaw.h,
; header-only) — test_relay_board — and the event journal line format / dedupe / rotation /
; RTC replay ring (include/EventJournalLaw.h, header-only) — test_event_journal — and the VESC
; UART receive parser with the inter-byte gap resync (include/VescRxParser.h, header-only) —
; test_vesc_rx — and the OBD-II no-data watchdog ignition gating (include/CanWatchdogLaw.h,
; header-only) — test_can_watchdog — and the GCS vehicle commands: decode / interlocks / RC
; last-change-wins / caps / versions (include/VehicleCommandLaw.h, header-only) —
; test_vehicle_cmd_law.
; One suite per indented test_filter line: the single-line
; space-separated form silently skips every suite. Overrides
; every inherited ESP32 setting; only LwsSensor.cpp from src/ is compiled.
[env:native]
platform = native
framework =
lib_deps =
lib_ignore =
build_flags = -std=gnu++17 -Wall -Wextra
build_src_filter = -<*> +<LwsSensor.cpp>
test_framework = unity
test_build_src = yes
test_filter =
    test_lws305
    test_steer_rate
    test_steer_sensor_dir
    test_speed_limiter
    test_steer_position
    test_steer_diag
    test_transmission_sync
    test_throttle_slew
    test_steer_park
    test_device_id
    test_brake_law
    test_relay_board
    test_event_journal
    test_vesc_rx
    test_can_watchdog
    test_vehicle_cmd_law
