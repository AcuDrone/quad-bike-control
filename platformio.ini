; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; ─── Global defaults (inherited by all environments) ─────────────────────────
[env]
lib_deps =
    https://github.com/mavlink/c_library_v2.git
    mathieucarbou/ESPAsyncWebServer@^3.4.6
    bblanchon/ArduinoJson@^6.21.3
    DNSServer
    https://github.com/coryjfowler/MCP_CAN_lib.git

lib_ignore = AsyncTCP_RP2040W

; Console runs on the ESP32-S3 native USB CDC device (USB-C connector), NOT UART0.
; UART0 / GPIO43-44 (Prog header X1) is the steering VESC link (aztec board: R63/R64
; to the CH9121T removed) — never move the console or any log output onto it.
; CORE_DEBUG_LEVEL=0 compiles out the Arduino log_x() calls, which print through the
; ROM putc path (UART0 by default) and would leak text into the VESC link.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

board_build.filesystem = littlefs

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; ─── ESP32-S3-DevKitC-1 N16R8 (16 MB flash, OPI PSRAM not used) ─────────────
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1

board_build.partitions = partitions_16mb.csv
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_qspi  ; quad flash + quad PSRAM SDK (OPI PSRAM unused, frees GPIO 33-37)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

upload_flags =
    --before=default_reset
    --after=hard_reset
    --chip=esp32s3

